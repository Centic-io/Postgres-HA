global
    maxconn 100

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Primary — read/write
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-node1 10.0.0.1:5432 maxconn 100 check port 8008
    server patroni-node2 10.0.0.2:5432 maxconn 100 check port 8008
    server patroni-node3 10.0.0.3:5432 maxconn 100 check port 8008

# Replica — read-only
listen standbys
    balance roundrobin
    bind *:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-node1 10.0.0.1:5432 maxconn 100 check port 8008
    server patroni-node2 10.0.0.2:5432 maxconn 100 check port 8008
    server patroni-node3 10.0.0.3:5432 maxconn 100 check port 8008
