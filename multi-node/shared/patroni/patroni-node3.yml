scope: pg-cluster
namespace: /prod/
name: patroni-node3

restapi:
  listen: 0.0.0.0:8008
  connect_address: 10.0.0.3:8008

etcd3:
  hosts:
    - 10.0.0.1:2379
    - 10.0.0.2:2379
    - 10.0.0.3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_keep_size: 128
        max_wal_senders: 5
        max_replication_slots: 10
        wal_log_hints: "on"
        max_connections: 512
        checkpoint_completion_target: 0.9
        effective_cache_size: 4GB
        work_mem: 4MB
        maintenance_work_mem: 512MB

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.0.0.3:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/local/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: "replicator_pass"
    superuser:
      username: postgres
      password: "postgres_pass"
  parameters:
    unix_socket_directories: "/var/run/postgresql"

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
